name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub Pages' CDN cold-pulls freshly deployed files very slowly (seconds
  # per asset). Fetching everything once right after deploy warms the CDN
  # shield, so real visitors get cache hits instead of origin pulls.
  warm-cache:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Warm CDN cache
        # Warming is best effort: a single TLS hiccup on one asset (curl exit
        # 35) used to abort the whole job under `bash -e` and report the
        # deploy as failed, even though the site was already live. Every
        # request retries, and the job never fails on a warm miss.
        continue-on-error: true
        run: |
          set +e
          BASE="https://fs-student-hedgefund.com"
          warm() { curl -s --retry 3 --retry-all-errors --max-time 30 -o /dev/null -w "warmed %{time_total}s  $2\n" "$1" || echo "warm miss  $2"; }
          sleep 10
          HTML=$(curl -s --retry 3 --retry-all-errors "$BASE/")
          # bundle (hashed name changes every deploy)
          echo "$HTML" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.(js|css)' | sort -u | while read -r p; do
            warm "https://francescodifano.github.io$p" "$p"
          done
          # all images and the reports
          curl -s --retry 3 --retry-all-errors "https://api.github.com/repos/francescodifano/fs-student-hedge-fund/contents/public/assets" \
            | grep -oE '"name": *"[^"]+"' | cut -d'"' -f4 | while read -r f; do
            warm "$BASE/assets/$f" "assets/$f"
          done
          curl -s "https://api.github.com/repos/francescodifano/fs-student-hedge-fund/contents/public/papers" \
            | grep -oE '"name": *"[^"]+"' | cut -d'"' -f4 | while read -r f; do
            warm "$BASE/papers/$f" "papers/$f"
          done
          warm "$BASE/favicon.png" "favicon.png"
          exit 0
